button{font:inherit;color:inherit;cursor:pointer}

    if(S.paused)return;

    while(S.i<slots.length&&(S.auto||!S.mine.has(slots[S.i].owner))){
      if(pace>0){renderAll();S.t=setTimeout(()=>{if(S.paused)return;aiTurn();go()},pace);return}
      aiTurn();
    }
    if(S.i>=slots.length)return finish();
    renderAll();
  };
  go();
}
function userPick(id){
  if(S.phase!=='draft'||!S.started||S.i>=slots.length||!S.mine.has(slots[S.i].owner)||S.taken[id])return;
  const p=PB[id];doPick(p);S.paused=false;$('#live').textContent=`You drafted ${p.name}`;advance();
}

/* ---------- player dialog ---------- */
function openPlayer(id){
  const p=PB[id],dlg=$('#dlg'),clock=S.phase==='draft'&&S.started&&S.i<slots.length&&S.mine.has(slots[S.i].owner)&&!S.taken[id];
  const sk=Object.fromEntries(D.skills.map((n,i)=>[n,p.r[i]])),ks=keyOf(p);
  dlg.innerHTML=`<div class="dl"><h2>${esc(p.name)}</h2>
  <div>${p.pos}${p.pos2?' / '+p.pos2:''} · ${esc(p.arch)}<br><span style="color:var(--mut)">${esc(p.school||'Unsigned')} · ${p.rs?'Redshirt ':''}${p.yr} · age ${p.age} · ${ht(p.ht)}, ${p.wt} lb · ${p.stars?'★'.repeat(p.stars):'No stars'}</span></div>
  <div class="ovp"><div><b>${p.ovr}</b><small>Overall</small></div><div><b>${p.pot}</b><small>Potential</small></div><div><b>${p.rank}</b><small>Prospect rank</small></div></div>
  <div class="kh">Key attributes for ${p.pos}</div><div class="rt">${ks.map(([n])=>`<span>${n}<b>${sk[n]}</b></span>`).join('')}</div>
  <div style="color:var(--mut);font-size:13px">Stamina ${sk.Stamina} · Injury ${sk.Injury}</div>
  <div class="acts">${S.phase==='draft'&&!S.started?'<span style="color:var(--mut);font-size:13px;align-self:center">Press Start draft to begin picking.</span>':''}<button class="ghost" data-x="1">Close</button>${clock?`<button class="pri" id="dr" data-id="${id}">Draft at pick ${slots[S.i].overall}${S.mine.size>1?' for '+slots[S.i].owner:''}</button>`:''}</div></div>`;
  dlg.showModal();
}

/* ---------- results ---------- */
const vd=k=>{const d=k.overall-k.p.rank,tl=tol(k.overall);return d>=tl?{c:'v',t:`Value (+${d})`}:d<=-tl?{c:'x',t:`Reach (${d})`}:{c:'',t:'Fair'}};
const verdict=k=>{const v=vd(k);return `<span class="tag ${v.c}">${v.t}</span>`};
const gradeOf=a=>grade(classScore(S.tp[a],T[a]));
function teamRes(a,multi){
  const t=T[a],mine=S.tp[a],filled=t.needs.filter(n=>mine.some(k=>hasPos(k.p,n))),h=multi?`<h2 class="tbn" style="${tcs(a)};font-size:30px;margin:22px 0 8px;padding:8px 16px">${esc(t.name)}</h2>`:'';
  if(!mine.length)return h+'<div class="panel li up">No picks in these rounds.</div>';
  const top=multi?`<p style="margin:0 0 8px;color:var(--mut)"><b style="color:var(--ink)">${mine.length} pick${mine.length===1?'':'s'}</b> · Filled ${filled.length} of ${t.needs.length} needs${filled.length?': '+filled.join(', '):''}</p>`:`<div class="panel" style="padding:14px 16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div class="gl"><span class="gt">${esc(t.name)}</span><span class="gr" aria-label="Class grade">${gradeOf(a)}</span></div><div><b>${mine.length} pick${mine.length===1?'':'s'}</b><br>Filled ${filled.length} of ${t.needs.length} needs${filled.length?': '+filled.join(', '):''}.<br><span style="color:var(--mut)">Grade rewards picks that fill an open need without reaching, with the best marks for surplus value.</span><br><button class="ghost" id="shg" data-a="${a}" style="margin-top:10px">Share image</button></div></div>`;
  return h+top+`
  <div class="panel" style="margin-top:12px"><div class="rr hd" style="color:var(--mut)"><span>Pick</span><span>Player</span><span>Pos</span><span>Ovr / Pot</span><span class="bk">Prospect rank</span></div>
  ${mine.map(k=>`<div class="rr" data-id="${k.p.id}" style="cursor:pointer"><span>${k.overall}<br><span class="tag">Rd ${k.r+1}</span></span><div style="min-width:0"><b>${esc(k.p.name)}</b><br><span class="tag">${esc(k.p.school||'Unsigned')} · ${verdict(k)}</span></div><b>${k.p.pos}</b><span>${k.p.ovr} / ${k.p.pot}</span><span class="bk">#${k.p.rank}</span></div>`).join('')}</div>`;
}
function recap(){
  const r1=S.log.filter(k=>k.r===0),half=n=>`<div style="overflow-x:auto"><table class="rt2"><thead><tr><th>#</th><th>Team</th><th>Player</th><th>Pos</th><th>School</th><th>Ovr / Pot</th></tr></thead><tbody>${r1.slice(n,n+16).map(k=>`<tr class="${S.mine.has(k.owner)?'me':''}"><td class="n">${k.overall}</td><td style="white-space:nowrap"><b class="tm" style="${tcs(k.owner)}">${k.owner}</b>${k.orig!==k.owner?`<span class="via">via ${k.orig}</span>`:''}</td><td><b>${esc(k.p.name)}</b></td><td>${k.p.pos}</td><td>${esc(k.p.school||'Unsigned')}</td><td>${k.p.ovr} / ${k.p.pot}</td></tr>`).join('')}</tbody></table></div>`;
  return `<section class="rc"><div class="rch"><h2 style="font-size:34px">Round 1 recap</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="color:var(--mut);font-size:13px">SimNFL Mock Draft · shaded rows are your picks</span><button class="ghost" id="shr">Share image</button></div></div><div class="rcg">${half(0)}${half(16)}</div></section>`;
}
function finish(){
  S.phase='done';
  const list=D.teams.map(t=>t.abbr).filter(a=>S.mine.has(a)),multi=list.length>1;
  const sum='';
  $('#app').innerHTML=`<header class="hero res${multi?'':' tbn'}"${multi?'':` style="${tcs(list[0])}"`}><h1>${multi?'Your draft classes':esc(T[list[0]].name)+' draft class'}</h1><p style="margin:6px 0 0;opacity:.85">${S.rounds===1?'Round 1':'Rounds 1–'+S.rounds}${multi?' · '+list.length+' teams':''}</p></header>
  ${recap()}${list.map(a=>teamRes(a,multi)).join('')}
  <div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap"><button class="pri" id="again">Draft again${multi?'':' as '+list[0]}</button><button class="ghost" id="change">Change teams or rounds</button></div>
  ${tradesPanel()}
  <h2 style="font-size:28px;margin-top:18px">Full draft</h2>
  ${Array.from({length:S.rounds},(_,r)=>r).map(r=>`<details class="rd"><summary>Round ${r+1}</summary>${S.log.filter(k=>k.r===r).map(k=>`<div class="li${S.mine.has(k.owner)?' me':''}" data-id="${k.p.id}"><b>${k.overall}. ${tm(k.owner)} ${esc(k.p.name)}</b><small>${k.p.pos} · ${esc(k.p.school||'Unsigned')} · ${k.p.ovr}/${k.p.pot}</small></div>`).join('')}</details>`).join('')}
  <div style="height:40px"></div>`;
  scrollTo(0,0);
}

/* ---------- share images ---------- */
const FH='"Barlow Condensed","Arial Narrow",Impact,sans-serif',FB='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fitText(x,s,w){s=String(s);if(x.measureText(s).width<=w)return s;while(s.length>1&&x.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function pillC(x,a,px,py,h,fs){const [p,s]=TC[a]||['#5B6781','#9AA6BF'];x.font=`700 ${fs}px ${FB}`;const w=Math.ceil(x.measureText(a).width)+20;x.fillStyle=s;rrect(x,px,py,w,h,6);x.fill();x.fillStyle=p;rrect(x,px,py,w,h-4,6);x.fill();x.fillStyle=ink(p);x.textAlign='center';x.textBaseline='middle';x.fillText(a,px+w/2,py+(h-4)/2+1);x.textAlign='left';return w}
function strip(x,a,b,w,h){const n=D.teams.length,sw=(w-3*(n-1))/n;D.teams.forEach((t,i)=>{const [p,s]=TC[t.abbr],px=a+i*(sw+3);x.fillStyle=s;x.fillRect(px,b,sw,h);x.fillStyle=p;x.fillRect(px,b,sw,h*.64)})}
function recapCanvas(){
  const r1=S.log.filter(k=>k.r===0),W=1600,M=44,G=44,cw=(W-2*M-G)/2,rh=46,n=Math.ceil(r1.length/2),H=190+n*rh+90,c=cv(W,H),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#16213A';x.font=`700 70px ${FH}`;x.fillText('Round 1 recap',M,88);
  x.textAlign='right';x.fillStyle='#5B6781';x.font=`600 26px ${FB}`;x.fillText('SimNFL Mock Draft Simulator',W-M,60);x.font=`400 20px ${FB}`;x.fillText('2028 class · shaded rows are the user’s picks',W-M,90);x.textAlign='left';
  strip(x,M,112,W-2*M,12);
  const cols={n:0,t:48,p:186,pos:452,s:540,o:632};
  [0,1].forEach(h=>{
    const x0=M+h*(cw+G);
    x.textBaseline='alphabetic';x.fillStyle='#5B6781';x.font=`700 17px ${FB}`;
    [['#','n'],['TEAM','t'],['PLAYER','p'],['POS','pos'],['SCHOOL','s'],['OVR / POT','o']].forEach(([l,k])=>x.fillText(l,x0+cols[k],166));
    x.fillStyle='#CBD3DE';x.fillRect(x0,176,cw,2);
    r1.slice(h*n,h*n+n).forEach((k,i)=>{
      const y=190+i*rh,cy=y+rh/2;
      if(S.mine.has(k.owner)){x.fillStyle='#E3F3EA';x.fillRect(x0-8,y,cw+16,rh)}
      x.fillStyle='#CBD3DE';x.fillRect(x0,y+rh-1,cw,1);
      x.textBaseline='middle';x.fillStyle='#5B6781';x.font=`600 20px ${FB}`;x.fillText(String(k.overall),x0+cols.n,cy);
      const pw=pillC(x,k.owner,x0+cols.t,y+8,rh-16,19);x.textBaseline='middle';
      if(k.orig!==k.owner){x.fillStyle='#5B6781';x.font=`400 14px ${FB}`;x.fillText('via '+k.orig,x0+cols.t+pw+6,cy)}
      x.fillStyle='#16213A';x.font=`700 20px ${FB}`;x.fillText(fitText(x,k.p.name,cols.pos-cols.p-10),x0+cols.p,cy);
      x.font=`600 19px ${FB}`;x.fillText(k.p.pos+(k.p.pos2?'/'+k.p.pos2:''),x0+cols.pos,cy);
      x.fillStyle='#5B6781';x.font=`400 18px ${FB}`;x.fillText(fitText(x,k.p.school||'Unsigned',cols.o-cols.s-8),x0+cols.s,cy);
      x.fillStyle='#16213A';x.font=`600 19px ${FB}`;x.fillText(`${k.p.ovr} / ${k.p.pot}`,x0+cols.o,cy);
    });
  });
  x.textBaseline='alphabetic';x.fillStyle='#5B6781';x.font=`500 20px ${FB}`;x.fillText('SimNFL Mock Draft Simulator',M,H-34);
  return c;
}
function gradeCanvas(a){
  const t=T[a],picks=S.tp[a],[p,s]=TC[a],tx=ink(p),W=1080,M=52,rh=picks.length>10?60:76,head=330,H=head+70+picks.length*rh+100,c=cv(W,H),x=c.getContext('2d');
  const got=t.needs.filter(n=>picks.some(k=>hasPos(k.p,n)));
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle=s;x.fillRect(0,0,W,head);x.fillStyle=p;x.fillRect(0,0,W,head-14);
  const bx=W-M-210,by=58;x.fillStyle=tx;rrect(x,bx,by,210,210,26);x.fill();
  x.fillStyle=p;x.textAlign='center';x.textBaseline='middle';x.font=`700 150px ${FH}`;x.fillText(gradeOf(a),bx+105,by+122);x.font=`700 20px ${FB}`;x.fillText('CLASS GRADE',bx+105,by+28);
  x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle=tx;let fs=84;x.font=`700 ${fs}px ${FH}`;const mw=W-2*M-250;while(x.measureText(t.name).width>mw&&fs>40){fs-=4;x.font=`700 ${fs}px ${FH}`}
  x.fillText(t.name,M,150);
  x.font=`600 28px ${FB}`;x.fillText(`SimNFL Mock Draft · ${S.rounds===1?'Round 1':'Rounds 1–'+S.rounds}`,M,204);
  x.font=`400 24px ${FB}`;x.fillText(fitText(x,`${picks.length} pick${picks.length===1?'':'s'} · Filled ${got.length} of ${t.needs.length} needs${got.length?': '+got.join(', '):''}`,mw),M,248);
  x.fillStyle='#5B6781';x.font=`700 18px ${FB}`;x.fillText('PICK',M,head+44);x.fillText('PLAYER',M+130,head+44);x.textAlign='right';x.fillText('VALUE',W-M,head+44);x.textAlign='left';
  x.fillStyle='#CBD3DE';x.fillRect(M,head+56,W-2*M,2);
  const tw=W-2*M-130-200,big=rh>64;
  picks.forEach((k,i)=>{
    const y=head+66+i*rh,v=vd(k),cy=y+rh/2;
    if(i%2===0){x.fillStyle='#F4F6F9';x.fillRect(M-12,y,W-2*M+24,rh)}
    x.textBaseline='middle';
    x.fillStyle='#16213A';x.font=`700 ${big?34:30}px ${FH}`;x.fillText('#'+k.overall,M,cy-8);
    x.fillStyle='#5B6781';x.font=`500 16px ${FB}`;x.fillText('Rd '+(k.r+1),M,cy+16);
    x.fillStyle='#16213A';x.font=`700 ${big?26:23}px ${FB}`;x.fillText(fitText(x,k.p.name,tw),M+130,cy-10);
    x.fillStyle='#5B6781';x.font=`400 ${big?19:17}px ${FB}`;x.fillText(fitText(x,`${k.p.pos}${k.p.pos2?'/'+k.p.pos2:''} · ${k.p.school||'Unsigned'} · ${k.p.ovr} / ${k.p.pot}`,tw),M+130,cy+14);
    x.textAlign='right';x.font=`700 ${big?22:20}px ${FB}`;x.fillStyle=v.c==='v'?'#1F7A4D':v.c==='x'?'#B3402A':'#5B6781';x.fillText(v.t,W-M,cy);x.textAlign='left';
  });
  x.textBaseline='alphabetic';x.fillStyle='#5B6781';x.font=`500 20px ${FB}`;x.fillText('SimNFL Mock Draft Simulator',M,H-48);strip(x,M,H-32,W-2*M,10);
  return c;
}
async function shareImg(make,name){
  try{await Promise.race([document.fonts.load('700 40px "Barlow Condensed"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  const blob=await new Promise(r=>make().toBlob(r,'image/png'));
  if(!blob){toast('Could not create the image');return}
  let d=null;try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data:blob});toast('Image saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save the image')}return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Image downloaded');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(S.tpOpen&&!e.target.closest('#tp,#tpbtn')){S.tpOpen=false;renderTeamPanel()}
  const b=e.target.closest('button,.row,.li,.rr,.dk');if(!b)return;
  if(b.matches('.team')){const a=b.dataset.a,i=S.sel.indexOf(a);i<0?S.sel.push(a):S.sel.splice(i,1);b.setAttribute('aria-pressed',String(i<0));info();return}
  if(b.id==='sall'||b.id==='snone'){S.sel=b.id==='sall'?D.teams.map(t=>t.abbr):[];document.querySelectorAll('.team').forEach(x=>x.setAttribute('aria-pressed',String(S.sel.includes(x.dataset.a))));info();return}
  if(b.id==='go')return startDraft();
  if(b.id==='again')return startDraft();
  if(b.id==='change')return showSetup();
  if(b.id==='start'){S.started=true;return advance()}
  if(b.id==='pause'){if(S.paused){S.paused=false;return advance()}S.paused=true;clearTimeout(S.t);return renderClock()}
  if(b.id==='exit'){
    if(S.started&&(S.log.length||S.trades.length)){$('#cfm').innerHTML='<div class="dl"><h2>Exit this draft?</h2><p style="margin:0;color:var(--mut)">Your picks and trades so far will be lost, and you will return to the start screen.</p><div class="acts"><button class="ghost" id="cstay">Keep drafting</button><button class="pri" id="cexit">Exit draft</button></div></div>';$('#cfm').showModal();return}
    return exitDraft()}
  if(b.id==='cstay')return $('#cfm').close();
  if(b.id==='cexit')return exitDraft();
  if(b.id==='trade')return openTrade();
  if(b.id==='tcancel')return $('#trd').close();
  if(b.id==='toffer')return tradeGo('offer');
  if(b.id==='tforce')return tradeGo('force');
  if(b.id==='tmake')return tradeGo('make');
  if(b.id==='tback')return renderTrade(S.tr.res);
  if(b.id==='tdone')return doTrade(S.tr.a,S.tr.b,S.tr.res.give,S.tr.res.get,'agreed');
  if(b.id==='tforce2')return doTrade(S.tr.a,S.tr.b,S.tr.res.give,S.tr.res.get,'forced');
  if(b.id==='shr')return shareImg(recapCanvas,'simnfl-mock-draft-round-1-recap.png');
  if(b.id==='shg'){const a=b.dataset.a;return shareImg(()=>gradeCanvas(a),`simnfl-${a.toLowerCase()}-draft-grade.png`)}
  if(b.id==='sim'){S.auto=true;S.paused=false;return advance()}
  if(b.id==='auto'){aiTurn();S.paused=false;return advance()}
  if(b.id==='dr'){$('#dlg').close();return userPick(+b.dataset.id)}
  if(b.dataset.x)return $('#dlg').close();
  if(b.dataset.t==='team'){S.tpOpen=!S.tpOpen;return renderTeamPanel()}
  if(b.dataset.t){S.tab=b.dataset.t;return renderTabs()}
  if(b.dataset.rn){S.rounds=+b.dataset.rn;return showSetup()}
  if(b.dataset.p){S.f.pos=b.dataset.p;S.f.needs=false;S.f.limit=50;document.querySelectorAll('#pc .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#nd').setAttribute('aria-pressed','false');return renderRows()}
  if(b.id==='nd'){S.f.needs=!S.f.needs;S.f.limit=50;b.setAttribute('aria-pressed',String(S.f.needs));return renderRows()}
  if(b.id==='more'){S.f.limit+=100;return renderRows()}
  if(b.dataset.id)openPlayer(+b.dataset.id);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;S.f.limit=50;renderRows()}});
document.addEventListener('change',e=>{
  if(e.target.id==='pace'){S.pace=e.target.value;if(S.phase==='draft'&&S.started&&!S.paused&&S.i<slots.length&&!S.mine.has(slots[S.i].owner))advance()}
  if(e.target.id==='ta'){S.tr.a=e.target.value;if(S.tr.b===S.tr.a)S.tr.b=D.teams.map(t=>t.abbr).find(x=>x!==S.tr.a);renderTrade()}
  if(e.target.id==='tb'){S.tr.b=e.target.value;renderTrade()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.tpOpen){S.tpOpen=false;renderTeamPanel()}});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('#trd').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('#cfm').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
showSetup();
</script>
